<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Framizz</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="stylesheet" href="./src/css/output.css">
  <link rel="stylesheet" href="./src/css/custom.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body id="body" class="font-sans">

  <!-- ── ANIMATED BACKGROUND ORBS ── -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  

  <!-- ── STAR PARTICLES (injected by JS) ── -->

  <!-- ── APP WRAPPER ── -->
  <div id="app-wrapper" class="w-full flex items-center justify-center p-4" style="height: 100dvh;">
    <div class="w-full max-w-[420px] flex flex-col gap-3" style="height: 100%; max-height: 100dvh; padding: 32px 0; justify-content: space-between;">

      <!-- ── HEADER ── -->
      <div class="flex items-center justify-between px-1">
        <!-- Logo -->
        <div class="flex items-center gap-2.5">
          <img
            src="assets/logo.png"
            alt="Framizz"
            class="w-10 h-10 rounded-xl"
            style="box-shadow: 0 4px 14px rgba(59,130,246,0.3);"
          >
          <span
            class="font-black text-xl tracking-tight"
            style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"
          >Framizz</span>
        </div>

        <!-- Theme Toggle -->
        <button
          id="themeToggle"
          class="flex items-center gap-2 py-1 transition-all"
          style="background: transparent; border: none; cursor: pointer; outline: none;"
          aria-label="Toggle theme"
        >
          <div class="toggle-track" id="toggleTrack">
            <div class="toggle-thumb" id="toggleThumb">
              <svg id="sunIcon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="color: #f59e0b;">
                <circle cx="12" cy="12" r="5"></circle>
                <path stroke-linecap="round" d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
              <svg id="moonIcon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="hidden" style="color: #93c5fd;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </div>
          </div>
          <span id="themeLabel" class="text-sm font-semibold" style="color: #64748b; min-width: 36px;">Light</span>
        </button>
      </div>

      <!-- ── CANVAS ── -->
      <div class="flex flex-col items-center gap-3" style="justify-content: center; min-height: 0; flex: 1;">
        <div class="card canvas-inner w-full" style="max-width: 380px; aspect-ratio: 1;">
          <div class="w-full h-full rounded-xl overflow-hidden">
            <canvas
              id="previewCanvas"
              width="400"
              height="400"
              class="rounded-xl"
              style="width: 100%; height: 100%; display: block;"
            ></canvas>
          </div>
        </div>

        <input type="file" id="fileInput" accept="image/*" class="hidden">

        <button
          id="chooseBtn"
          class="btn-primary w-full h-12 flex items-center justify-center gap-2 text-[15px]"
          style="max-width: 380px;"
        >
          <svg class="flex-shrink-0" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span>Choose Profile Picture</span>
        </button>
      </div>

      <!-- ── CONTROLS ── -->
      <div id="controls" class="hidden w-full flex items-center gap-2" style="max-width: 420px;">
        <div class="card flex items-center gap-3 px-4 py-3 flex-1">
          <svg class="w-4 h-4 flex-shrink-0" style="color: #94a3b8;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <input type="range" id="zoomSlider" min="40" max="300" value="100" class="zoom-slider flex-1" style="--val: 33%">
          <svg class="w-4 h-4 flex-shrink-0" style="color: #94a3b8;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/>
          </svg>
        </div>
        <button id="saveBtn" class="btn-save h-12 px-5 flex items-center gap-2 text-sm whitespace-nowrap">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m9 12v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m5-5l4 5 4-5"/>
          </svg>
          Download
        </button>
      </div>

      <!-- ── FOOTER ── -->
      <div class="text-center" style="color: #94a3b8;">
        <div class="text-xs font-medium mb-0.5">
          © 2026 Developed by
          <a
            href="https://lelius.vercel.app"
            target="_blank"
            rel="noopener noreferrer"
            class="font-semibold transition-colors"
            style="color: #3b82f6; -webkit-tap-highlight-color: transparent;"
          >Lelius Lawas</a>
        </div>
        <div class="text-[11px]" style="color: #b0bec9;">College of Computing and Information Sciences</div>
      </div>

    </div>
  </div>

  <script>
    // ── STAR PARTICLES ────────────────────────────────────────
    (function spawnStars() {
      const count = 28;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 3 + 1.5;
        s.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          top: ${Math.random() * 100}%;
          left: ${Math.random() * 100}%;
          animation-duration: ${2.5 + Math.random() * 4}s;
          animation-delay: ${-Math.random() * 5}s;
        `;
        document.body.appendChild(s);
      }
    })();
  </script>

  <script src="./src/js/script.js"></script>
</body>
</html>
